<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My College Diary - Created by Sachin Kumar</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel compiler so browser understands JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function CollegeDiaryApp() {
      // Local state for user session
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('mcd_user');
        return saved ? JSON.parse(saved) : null;
      });

      // Entries list
      const [entries, setEntries] = useState(() => {
        const saved = localStorage.getItem('mcd_entries');
        return saved ? JSON.parse(saved) : [
          {
            id: '1',
            date: new Date().toISOString().split('T')[0],
            subject: 'Data Structures & Algorithms',
            sessionType: 'Lecture',
            faculty: 'Prof. Sharma',
            topicsCovered: 'Binary Search Trees & AVL Rotations',
            notes: 'Covered insertion, deletion, and balancing algorithms. Remember O(log n) time complexity proof.',
            homework: {
              hasHomework: true,
              title: 'Implement AVL Tree in Java',
              dueDate: new Date(Date.now() + 86400000 * 2).toISOString().split('T')[0],
              priority: 'High',
              isCompleted: false
            },
            attachments: []
          }
        ];
      });

      // Filter and tab states
      const [searchQuery, setSearchQuery] = useState('');
      const [filterSubject, setFilterSubject] = useState('ALL');
      const [activeTab, setActiveTab] = useState('diary'); // 'diary', 'homework'
      const [isModalOpen, setIsModalOpen] = useState(false);

      // New entry form state
      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        subject: '',
        sessionType: 'Lecture',
        faculty: '',
        topicsCovered: '',
        notes: '',
        hasHomework: false,
        hwTitle: '',
        hwDueDate: '',
        hwPriority: 'Medium',
        attachments: []
      });

      // Save to localStorage whenever entries change
      useEffect(() => {
        localStorage.setItem('mcd_entries', JSON.stringify(entries));
      }, [entries]);

      const handleLogin = (e) => {
        e.preventDefault();
        const email = e.target.email.value;
        const userObj = { email, name: email.split('@')[0] };
        setCurrentUser(userObj);
        localStorage.setItem('mcd_user', JSON.stringify(userObj));
      };

      const handleGuestLogin = () => {
        const guestUser = { email: 'student@college.edu', name: 'Demo Student' };
        setCurrentUser(guestUser);
        localStorage.setItem('mcd_user', JSON.stringify(guestUser));
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('mcd_user');
      };

      // Add new class log
      const handleCreateEntry = (e) => {
        e.preventDefault();
        if (!formData.subject || !formData.topicsCovered) return;

        const newEntry = {
          id: Date.now().toString(),
          date: formData.date,
          subject: formData.subject,
          sessionType: formData.sessionType,
          faculty: formData.faculty,
          topicsCovered: formData.topicsCovered,
          notes: formData.notes,
          homework: {
            hasHomework: formData.hasHomework,
            title: formData.hwTitle,
            dueDate: formData.hwDueDate,
            priority: formData.hwPriority,
            isCompleted: false
          },
          attachments: formData.attachments
        };

        setEntries([newEntry, ...entries]);
        setIsModalOpen(false);
        setFormData({
          date: new Date().toISOString().split('T')[0],
          subject: '',
          sessionType: 'Lecture',
          faculty: '',
          topicsCovered: '',
          notes: '',
          hasHomework: false,
          hwTitle: '',
          hwDueDate: '',
          hwPriority: 'Medium',
          attachments: []
        });
      };

      // Toggle homework completion
      const toggleHomework = (id) => {
        setEntries(entries.map(entry => {
          if (entry.id === id && entry.homework) {
            return {
              ...entry,
              homework: {
                ...entry.homework,
                isCompleted: !entry.homework.isCompleted
              }
            };
          }
          return entry;
        }));
      };

      // Delete entry
      const deleteEntry = (id) => {
        if (confirm("Are you sure you want to delete this diary entry?")) {
          setEntries(entries.filter(e => e.id !== id));
        }
      };

      // Handle file conversion to base64
      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files);
        files.forEach(file => {
          const reader = new FileReader();
          reader.onloadend = () => {
            setFormData(prev => ({
              ...prev,
              attachments: [...prev.attachments, { name: file.name, data: reader.result, type: file.type }]
            }));
          };
          reader.readAsDataURL(file);
        });
      };

      // Filtered entries
      const filteredEntries = entries.filter(item => {
        const matchesSearch = item.subject.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              item.topicsCovered.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              item.notes.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesSubject = filterSubject === 'ALL' || item.subject === filterSubject;
        return matchesSearch && matchesSubject;
      });

      const uniqueSubjects = Array.from(new Set(entries.map(e => e.subject))).filter(Boolean);

      // --- LOGIN SCREEN ---
      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 via-white to-slate-100">
            <div className="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
              <div className="text-center mb-6">
                <div className="inline-flex items-center justify-center w-14 h-14 bg-indigo-600 text-white rounded-2xl shadow-lg mb-3">
                  <span className="text-2xl font-bold">📚</span>
                </div>
                <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">My College Diary</h1>
                <div className="inline-flex items-center gap-1.5 px-3 py-1 mt-2 rounded-full bg-indigo-50 border border-indigo-100 text-indigo-700 text-xs font-semibold">
                  <span>Author:</span>
                  <span>Created by Sachin Kumar</span>
                </div>
                <p className="text-sm text-slate-500 mt-2">Sign in to track your college classes & homework</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">College Email</label>
                  <input 
                    name="email" 
                    type="email" 
                    required 
                    placeholder="student@college.edu" 
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Password</label>
                  <input 
                    name="password" 
                    type="password" 
                    required 
                    placeholder="••••••••" 
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                  />
                </div>
                <button 
                  type="submit" 
                  className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition duration-150 shadow-md shadow-indigo-200 text-sm"
                >
                  Sign In to Diary
                </button>
              </form>

              <div className="relative my-6">
                <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-200"></div></div>
                <div className="relative flex justify-center text-xs uppercase"><span className="bg-white px-2 text-slate-400">or preview directly</span></div>
              </div>

              <button 
                onClick={handleGuestLogin} 
                className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 rounded-xl transition duration-150 text-sm"
              >
                Continue as Guest Student
              </button>
            </div>
          </div>
        );
      }

      // --- MAIN APP DASHBOARD ---
      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <span className="text-2xl">📖</span>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-slate-900 tracking-tight">My College Diary</span>
                    <span className="text-xs bg-indigo-50 text-indigo-700 font-medium px-2 py-0.5 rounded-md border border-indigo-100">
                      Created by Sachin Kumar
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 hidden sm:block">Logged in as {currentUser.email}</p>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setIsModalOpen(true)}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-1.5 rounded-lg text-sm font-semibold shadow-sm transition"
                >
                  + Add Daily Class
                </button>
                <button 
                  onClick={handleLogout}
                  className="text-xs font-semibold text-slate-600 hover:text-red-600 px-2.5 py-1.5 border border-slate-200 rounded-lg hover:border-red-200 transition"
                >
                  Sign Out
                </button>
              </div>
            </div>
          </header>

          {/* Navigation Bar */}
          <div className="bg-white border-b border-slate-200">
            <div className="max-w-6xl mx-auto px-4 flex gap-6">
              <button 
                onClick={() => setActiveTab('diary')}
                className={`py-3 text-sm font-semibold border-b-2 transition ${activeTab === 'diary' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}`}
              >
                Class Diary Logs ({entries.length})
              </button>
              <button 
                onClick={() => setActiveTab('homework')}
                className={`py-3 text-sm font-semibold border-b-2 transition ${activeTab === 'homework' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}`}
              >
                Homework Hub ({entries.filter(e => e.homework?.hasHomework && !e.homework?.isCompleted).length} Pending)
              </button>
            </div>
          </div>

          {/* Main Content Area */}
          <main className="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">
            {/* Search and Filters */}
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 flex flex-col sm:flex-row gap-3 items-center justify-between">
              <input 
                type="text" 
                placeholder="Search topics, subjects, or notes..." 
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full sm:w-80 px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
              <div className="flex items-center gap-2 w-full sm:w-auto">
                <span className="text-xs font-medium text-slate-500">Subject:</span>
                <select 
                  value={filterSubject}
                  onChange={(e) => setFilterSubject(e.target.value)}
                  className="px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-auto"
                >
                  <option value="ALL">All Subjects</option>
                  {uniqueSubjects.map(sub => <option key={sub} value={sub}>{sub}</option>)}
                </select>
              </div>
            </div>

            {/* View: Diary List */}
            {activeTab === 'diary' && (
              <div className="grid gap-4">
                {filteredEntries.length === 0 ? (
                  <div className="text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
                    <p className="text-slate-400 font-medium">No class diary records found.</p>
                    <button 
                      onClick={() => setIsModalOpen(true)}
                      className="mt-3 text-sm font-semibold text-indigo-600 hover:underline"
                    >
                      Log your first class notes now
                    </button>
                  </div>
                ) : (
                  filteredEntries.map(entry => (
                    <div key={entry.id} className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 hover:shadow-md transition">
                      <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3 mb-3">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-slate-900 text-lg">{entry.subject}</span>
                          <span className="text-xs px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 font-medium">
                            {entry.sessionType}
                          </span>
                        </div>
                        <div className="flex items-center gap-3">
                          <span className="text-xs text-slate-400 font-medium">📅 {entry.date}</span>
                          <button 
                            onClick={() => deleteEntry(entry.id)} 
                            className="text-xs text-red-500 hover:text-red-700 font-semibold px-2 py-1 rounded hover:bg-red-50 transition"
                          >
                            Delete
                          </button>
                        </div>
                      </div>

                      <div className="mb-3">
                        <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-0.5">Topics Taught in College:</span>
                        <p className="text-sm font-medium text-slate-800">{entry.topicsCovered}</p>
                      </div>

                      {entry.faculty && (
                        <p className="text-xs text-slate-500 mb-2"><strong>Faculty:</strong> {entry.faculty}</p>
                      )}

                      {entry.notes && (
                        <div className="bg-slate-50 rounded-lg p-3 text-xs text-slate-700 whitespace-pre-line mb-3">
                          {entry.notes}
                        </div>
                      )}

                      {/* Embedded Homework Section */}
                      {entry.homework?.hasHomework && (
                        <div className={`mt-3 p-3 rounded-lg border flex items-center justify-between gap-3 ${entry.homework.isCompleted ? 'bg-emerald-50 border-emerald-200' : 'bg-amber-50 border-amber-200'}`}>
                          <div className="flex items-start gap-2.5">
                            <input 
                              type="checkbox" 
                              checked={entry.homework.isCompleted} 
                              onChange={() => toggleHomework(entry.id)}
                              className="mt-1 h-4 w-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300 cursor-pointer"
                            />
                            <div>
                              <p className={`text-sm font-semibold ${entry.homework.isCompleted ? 'line-through text-emerald-800' : 'text-amber-900'}`}>
                                📝 HW: {entry.homework.title}
                              </p>
                              {entry.homework.dueDate && (
                                <p className="text-xs text-amber-700">Due Date: {entry.homework.dueDate}</p>
                              )}
                            </div>
                          </div>
                          <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ${entry.homework.isCompleted ? 'bg-emerald-200 text-emerald-800' : 'bg-amber-200 text-amber-800'}`}>
                            {entry.homework.isCompleted ? 'Completed' : 'Pending'}
                          </span>
                        </div>
                      )}

                      {/* Attachments preview */}
                      {entry.attachments && entry.attachments.length > 0 && (
                        <div className="mt-3 pt-3 border-t border-slate-100 flex flex-wrap gap-2">
                          {entry.attachments.map((file, i) => (
                            <a 
                              key={i} 
                              href={file.data} 
                              download={file.name} 
                              className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded flex items-center gap-1 transition"
                            >
                              📎 {file.name}
                            </a>
                          ))}
                        </div>
                      )}
                    </div>
                  ))
                )}
              </div>
            )}

            {/* View: Homework Hub */}
            {activeTab === 'homework' && (
              <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                <h2 className="text-base font-bold text-slate-800 mb-4">All Assigned Homework & Tasks</h2>
                <div className="space-y-3">
                  {entries.filter(e => e.homework?.hasHomework).length === 0 ? (
                    <p className="text-sm text-slate-400 py-6 text-center">No homework tasks added yet.</p>
                  ) : (
                    entries.filter(e => e.homework?.hasHomework).map(item => (
                      <div key={item.id} className="flex items-center justify-between p-3.5 rounded-lg border border-slate-200 hover:border-slate-300 transition">
                        <div className="flex items-center gap-3">
                          <input 
                            type="checkbox" 
                            checked={item.homework.isCompleted} 
                            onChange={() => toggleHomework(item.id)}
                            className="h-4 w-4 rounded text-indigo-600 cursor-pointer"
                          />
                          <div>
                            <span className="text-xs font-semibold px-2 py-0.5 bg-slate-100 rounded text-slate-600 mr-2">{item.subject}</span>
                            <span className={`text-sm font-medium ${item.homework.isCompleted ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                              {item.homework.title}
                            </span>
                          </div>
                        </div>
                        <div className="flex items-center gap-3">
                          <span className="text-xs text-slate-500 font-medium">Due: {item.homework.dueDate || 'No date'}</span>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${item.homework.priority === 'High' ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-700'}`}>
                            {item.homework.priority}
                          </span>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}
          </main>

          {/* Modal for adding daily class */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-slate-100 overflow-hidden max-h-[90vh] flex flex-col">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h3 className="font-bold text-slate-900">Log Daily College Class</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <form onSubmit={handleCreateEntry} className="p-6 overflow-y-auto space-y-4 text-sm">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Date</label>
                      <input 
                        type="date" 
                        required 
                        value={formData.date} 
                        onChange={(e) => setFormData({...formData, date: e.target.value})}
                        className="w-full px-3 py-2 border rounded-lg"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Session Type</label>
                      <select 
                        value={formData.sessionType} 
                        onChange={(e) => setFormData({...formData, sessionType: e.target.value})}
                        className="w-full px-3 py-2 border rounded-lg bg-white"
                      >
                        <option>Lecture</option>
                        <option>Practical Lab</option>
                        <option>Tutorial</option>
                        <option>Seminar</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Subject Name *</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="e.g. Computer Networks, Physics" 
                      value={formData.subject} 
                      onChange={(e) => setFormData({...formData, subject: e.target.value})}
                      className="w-full px-3 py-2 border rounded-lg"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Topics Taught in College *</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="e.g. Chapter 4: OSI Model Layers" 
                      value={formData.topicsCovered} 
                      onChange={(e) => setFormData({...formData, topicsCovered: e.target.value})}
                      className="w-full px-3 py-2 border rounded-lg"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Teacher / Faculty Name (Optional)</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Dr. Verma" 
                      value={formData.faculty} 
                      onChange={(e) => setFormData({...formData, faculty: e.target.value})}
                      className="w-full px-3 py-2 border rounded-lg"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Detailed Notes / Summary</label>
                    <textarea 
                      rows="3" 
                      placeholder="Key formulas, concepts, or important exam tips..." 
                      value={formData.notes} 
                      onChange={(e) => setFormData({...formData, notes: e.target.value})}
                      className="w-full px-3 py-2 border rounded-lg"
                    />
                  </div>

                  {/* Homework Toggle Box */}
                  <div className="border border-indigo-100 bg-indigo-50/50 p-4 rounded-xl space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="font-semibold text-xs text-indigo-950 uppercase tracking-wide">Did you get Homework today?</span>
                      <input 
                        type="checkbox" 
                        checked={formData.hasHomework} 
                        onChange={(e) => setFormData({...formData, hasHomework: e.target.checked})}
                        className="h-4 w-4 rounded text-indigo-600 cursor-pointer"
                      />
                    </div>

                    {formData.hasHomework && (
                      <div className="space-y-3 pt-2">
                        <input 
                          type="text" 
                          placeholder="Homework title / task description" 
                          value={formData.hwTitle} 
                          onChange={(e) => setFormData({...formData, hwTitle: e.target.value})}
                          className="w-full px-3 py-2 border rounded-lg text-sm bg-white"
                        />
                        <div className="grid grid-cols-2 gap-2">
                          <input 
                            type="date" 
                            value={formData.hwDueDate} 
                            onChange={(e) => setFormData({...formData, hwDueDate: e.target.value})}
                            className="px-3 py-2 border rounded-lg text-xs bg-white"
                          />
                          <select 
                            value={formData.hwPriority} 
                            onChange={(e) => setFormData({...formData, hwPriority: e.target.value})}
                            className="px-3 py-2 border rounded-lg text-xs bg-white"
                          >
                            <option>High</option>
                            <option>Medium</option>
                            <option>Low</option>
                          </select>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* File Upload */}
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Attach Whiteboard Photo / Document</label>
                    <input 
                      type="file" 
                      multiple 
                      onChange={handleFileUpload}
                      className="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"
                    />
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button 
                      type="button" 
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 rounded-lg border text-slate-600 hover:bg-slate-50 font-medium"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      className="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold"
                    >
                      Save to Diary
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-500 mt-auto">
            <p>My College Diary • Crafted with passion by <strong>Sachin Kumar</strong></p>
          </footer>
        </div>
      );
    }

    // Render the React app
    ReactDOM.createRoot(document.getElementById('root')).render(<CollegeDiaryApp />);
  </script>

</body>
</html>
